
type staff @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  email: String!
  passwordHash: String!
  role: String!
}

type customer @table { 
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  cpf: String @unique
  telephone: String
  preferences: String
}

type product @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  description: String
  price: Float!
  barcode: String @unique
}

type productStock @table {
  id: UUID! @default(expr: "uuidV4()")
  productId: product!
  quantity: Int!
  modifiedAt: Timestamp! @default(expr: "request.time")
}

type paymentMethod @table {
  id: UUID! @default(expr: "uuidV4()")
  methodName: String!
}

type saleType @table {
  id: UUID! @default(expr: "uuidV4()")
  typeName: String!
}

type sale @table { 
  id: UUID! @default(expr: "uuidV4()")
  staffId: staff!
  customerId: customer 
  saleTypeId: saleType!
  totalAmount: Float!
  discountAmount: Float!
  createdAt: Timestamp! @default(expr: "request.time")
}

type saleItem @table { 
  id: UUID! @default(expr: "uuidV4()")
  saleId: sale! 
  productId: product!
  quantity: Int!
  unitPrice: Float!
}

type salePayment @table { 
  id: UUID! @default(expr: "uuidV4()")
  saleId: sale! 
  paymentMethodId: paymentMethod!
  amountPaid: Float!
}